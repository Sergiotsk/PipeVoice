[project]
name = "pipevoice"
version = "1.0.0"
description = "Push-to-talk voice transcription CLI — hold F9, pipe to anything"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "openai-whisper==20231117",
    "torch>=2.0.0",
    "sounddevice==0.4.6",
    "pynput==1.7.6",
    "numpy==1.26.4",
    "keyboard==0.13.5",
]

[project.scripts]
pipevoice = "pipevoice.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
no-build-isolation-package = ["openai-whisper"]

[tool.uv.extra-build-dependencies]
# openai-whisper's setup.py hace `import pkg_resources` pero no lo declara
# como build dependency. Sin esto, `uv tool install` (y cualquier build sin
# aislamiento) falla con ModuleNotFoundError. Bug real encontrado 2026-08-11
# instalando PipeVoice desde cero con `uv tool install --reinstall`.
openai-whisper = ["setuptools", "pkg_resources"]

[tool.pyright]
venvPath = "."
venv = ".venv"
